<style>
:root{
  --ink:#14213D; --ink2:#22335c; --bg:#EEF1F5; --card:#FFFFFF; --text:#1B2433; --muted:#667085;
  --line:#DCE1E8; --teal:#0E8C7F; --teal-d:#0a6e64; --mustard:#F2B705; --red:#C2362B; --amber:#D98A00; --green:#1E8E4E;
  --r-lg:16px; --r-sm:10px;
  --font:'Outfit', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
a{color:var(--teal)}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}

/* ---------- Login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ink)}
.login-box{width:100%;max-width:380px;background:var(--card);border-radius:var(--r-lg);padding:32px 28px}
.brand-mark{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.sole{width:48px;height:48px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;background:var(--mustard);display:grid;place-items:center;font-weight:700;color:var(--ink);font-size:20px;border:2px dashed var(--ink);outline:3px solid var(--mustard)}
.brand-mark h1{font-size:22px;margin:0;line-height:1.1}
.brand-mark small{color:var(--muted)}

/* ---------- Shell ---------- */
.side{position:fixed;inset:0 auto 0 0;width:236px;background:var(--ink);color:#fff;display:flex;flex-direction:column;z-index:40;transition:transform .25s ease;padding-top:env(safe-area-inset-top,0px)}
.side .brand-mark{padding:20px 18px 8px;margin:0}
.side .brand-mark h1{color:#fff;font-size:18px}
.side .brand-mark small{color:#aab4c8}
.side nav{flex:1;overflow:auto;padding:10px}
.side nav button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;color:#d5dbe8;padding:10px 12px;border-radius:var(--r-sm);cursor:pointer;text-align:left;font-size:15px}
.side nav button:hover{background:var(--ink2);color:#fff}
.side nav button.on{background:var(--mustard);color:var(--ink);font-weight:600}
.side nav .grp{font-size:12px;color:#8793ab;margin:14px 12px 4px}
.side .who{padding:14px 18px;border-top:1px solid var(--ink2);font-size:13px;color:#aab4c8;display:flex;justify-content:space-between;align-items:center}
.side .who button{background:none;border:1px solid #4a5a80;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
main{margin-left:236px;min-height:100vh;padding:0 0 90px}
.topbar{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.topbar h2{margin:0;font-size:20px;flex:1}
.menu-btn{display:none;background:var(--ink);color:#fff;border:0;border-radius:10px;width:40px;height:40px;font-size:20px;cursor:pointer}
.role-chip{font-size:12px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--muted)}
#view{padding:18px 20px;max-width:1280px}
.scrim{display:none}
.bottom-nav{display:none}

/* ---------- Components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:17px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.card-h h3{margin:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;border-left:5px solid var(--teal)}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:21px;font-weight:700;margin-top:2px;word-break:break-word}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.bank{border-left-color:var(--mustard)}
.kpi.neg{border-left-color:var(--red)}
.kpi.cash{background:var(--ink);color:#fff;border-color:var(--ink);border-left-color:var(--mustard)}
.kpi.cash .l,.kpi.cash .s{color:#c4cce0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:#fff;color:var(--text);width:100%;min-height:44px}
input:focus,select:focus,textarea:focus{border-color:var(--teal);outline:2px solid rgba(14,140,127,.2)}
.check{flex-direction:row;align-items:center;gap:8px;color:var(--text)}
.check input{width:20px;min-height:20px}
.btn{background:var(--teal);color:#fff;border:0;border-radius:var(--r-sm);padding:11px 18px;font-weight:600;cursor:pointer;min-height:44px;white-space:nowrap}
.btn:hover{background:var(--teal-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--bg)}
.btn.dark{background:var(--ink)}
.btn.red{background:var(--red)}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px;font-weight:500}
.row-end{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.hint{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.hint.bad{color:var(--red)}
.hint.ok{color:var(--green)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12.5px;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--card)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

tbody tr:hover td{background:#f7f9fb}

  .bottom-nav button{flex:1;background:none;border:0;color:#c4cce0;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;cursor:pointer}

}

<script>
/* =========================================================
   Mihely Shoe Shop – Business Manager (single-file web app)
   Data is stored in this browser (localStorage).
   ========================================================= */
/* ================================================================
   1) PASTE YOUR FIREBASE CONFIG HERE
      (Firebase console > Project settings > Your apps > Web app)
   ================================================================ */
// Import the functions you need from the SDKs you need


import { initializeApp } from "firebase/app";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyC-v5UkxkcaK0nmF-Ash3TozdB31szGSGs",
  authDomain: "mihely-shoe-shop.firebaseapp.com",
  projectId: "mihely-shoe-shop",
  storageBucket: "mihely-shoe-shop.firebasestorage.app",
  messagingSenderId: "1010956667223",
  appId: "1:1010956667223:web:530f110aaf3d1a7d3f9612"
};


// Initialize Firebase
const app = initializeApp(firebaseConfig);
/* 2) LOGINS – username "inok" signs in as inok@mihely.app, and so on.
      Create these users in Firebase > Authentication.               */
const EMAIL_DOMAIN = 'mihely.app';
const ADMIN_EMAILS = ['inok@mihely.app'];   // every other allowed login is a sales user
/* ================================================================ */

const OLD_KEY='mihely_shoe_db_v1';
const COLLS=['purchases','sales','returns','deposits','withdrawals','expenses','capital','adjustments'];
const EXP_CATS = ['Rent','Electricity','Water','Telephone / Internet','Salaries','Transport','Tea & Meals','Stationery','Repairs & Maintenance','Advertising','Bank charges','Other'];
function DEFAULT_DB(){return{
  settings:{shop:'Mihely Shoe Shop',address:'',phone:'',openingCash:0,openingBOC:0,openingMPCS:0,lowStockDefault:3},
  items:{},purchases:[],sales:[],returns:[],deposits:[],withdrawals:[],expenses:[],capital:[],adjustments:[]
};}
let db = DEFAULT_DB();
const CONFIGURED = !firebaseConfig.apiKey.startsWith('PASTE') && typeof firebase!=='undefined';
let fs=null, auth=null;
if(CONFIGURED){
  try{firebase.initializeApp(firebaseConfig);
  auth=firebase.auth(); fs=firebase.firestore();}catch(e){console.error(e);setTimeout(()=>{const m=document.getElementById('l_msg');if(m)m.textContent='firebaseConfig is not valid: '+e.message;},0);}
  if(fs)fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});   // keeps working offline
}

/* ---------- cloud sync ---------- */
function clean(o){return JSON.parse(JSON.stringify(o));}
function stable(v){ // key-order independent JSON, used to detect real changes
  if(Array.isArray(v))return '['+v.map(stable).join(',')+']';
  if(v&&typeof v==='object')return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+stable(v[k])).join(',')+'}';
  return JSON.stringify(v===undefined?null:v);
}
let synced={items:{},settings:''};COLLS.forEach(c=>synced[c]={});
function save(){
  if(!fs)return;
  const ops=[],cur={items:{}};
  Object.values(db.items).forEach(i=>cur.items[i.code]=stable(clean(i)));
  COLLS.forEach(c=>{cur[c]={};db[c].forEach(r=>cur[c][r.id]=stable(clean(r)));});
  ['items',...COLLS].forEach(c=>{
    const src=c==='items'?db.items:Object.fromEntries(db[c].map(r=>[r.id,r]));
    for(const id in cur[c]) if(cur[c][id]!==synced[c][id]) ops.push(['set',fs.collection(c).doc(id),clean(src[id])]);
    for(const id in synced[c]) if(!(id in cur[c])) ops.push(['del',fs.collection(c).doc(id)]);
    synced[c]=cur[c];
  });
  const st=stable(clean(db.settings));
  if(st!==synced.settings){ops.push(['set',fs.collection('meta').doc('settings'),clean(db.settings)]);synced.settings=st;}
  for(let i=0;i<ops.length;i+=400){
    const b=fs.batch();ops.slice(i,i+400).forEach(o=>o[0]==='set'?b.set(o[1],o[2]):b.delete(o[1]));
    b.commit().catch(e=>{console.error(e);toast(e.code==='permission-denied'?'You do not have permission to change this.':'Could not save to the cloud: '+(e.code||e.message),true);});
  }
}
let unsubs=[],loaded=new Set(),remoteT=null;
function stopSync(){unsubs.forEach(u=>u());unsubs=[];}
function syncErr(e){console.error(e);
  if(e.code==='permission-denied'){toast('This login is not allowed to open the shop data.',true);auth.signOut();}
  else toast('Sync problem: '+(e.code||e.message),true);}
function startSync(){
  stopSync();loaded=new Set();
  const done=(name,local)=>{
    if(!loaded.has(name)){loaded.add(name);if(loaded.size===COLLS.length+2){ready=true;boot();}}
    else if(!local&&ready)onRemoteChange();
  };
  unsubs.push(fs.collection('items').onSnapshot(snap=>{
    const o={},h={};snap.forEach(d=>{const x=d.data();o[x.code]=x;h[x.code]=stable(x);});
    db.items=o;synced.items=h;done('items',snap.metadata.hasPendingWrites);},syncErr));
  COLLS.forEach(c=>unsubs.push(fs.collection(c).onSnapshot(snap=>{
    const a=[],h={};snap.forEach(d=>{const x=d.data();a.push(x);h[x.id]=stable(x);});
    db[c]=a;synced[c]=h;done(c,snap.metadata.hasPendingWrites);},syncErr)));
  unsubs.push(fs.collection('meta').doc('settings').onSnapshot(d=>{
    db.settings=Object.assign(DEFAULT_DB().settings,d.exists?d.data():{});
    synced.settings=d.exists?stable(d.data()):stable(clean(db.settings));
    const n=$('#shopName');if(n)n.textContent=db.settings.shop;
    done('settings',d.metadata.hasPendingWrites);},syncErr));
}
function onRemoteChange(){ // another device changed data: refresh read-only pages
  clearTimeout(remoteT);remoteT=setTimeout(()=>{
    const ae=document.activeElement,typing=ae&&['INPUT','SELECT','TEXTAREA'].includes(ae.tagName);
    if(['dash','inventory','profit','bank','history'].includes(state.page)&&$('#modal').classList.contains('hidden')&&!typing)refresh();
  },700);
}
function netChip(){const c=document.getElementById('netChip');if(!c)return;const on=navigator.onLine;
  c.textContent=on?'● Online':'○ Offline – will sync later';c.style.color=on?'var(--green)':'var(--red)';}
addEventListener('online',netChip);addEventListener('offline',netChip);
function setCounterFromSales(){
  if(!fs)return;const n=Math.max(0,...db.sales.map(s=>{const m=/^INV(\d+)$/.exec(s.id);return m?+m[1]:0;}));
  fs.collection('meta').doc('counter').set({invSeq:n}).catch(()=>{});
}

/* ---------- helpers ---------- */
const $=(s)=>document.querySelector(s);
const val=(id)=>{const el=document.getElementById(id);return el?el.value:'';};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
const money=n=>'Rs. '+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const m0=n=>(Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:0});
const pct=n=>(isFinite(n)?n:0).toFixed(1)+'%';
function dstr(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const todayStr=()=>dstr(new Date());
const nowTime=()=>new Date().toTimeString().slice(0,5);
function daysBetween(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function monthLabel(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleString('en-US',{month:'long',year:'numeric'});}
function shortMonth(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleString('en-US',{month:'short'})+' '+String(y).slice(2);}
function daysInMonth(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();}
function addMonths(ym,k){const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+k,1);return dstr(d).slice(0,7);}
const normCode=c=>String(c||'').trim().toUpperCase();
function toast(msg,bad){const t=$('#toast');t.textContent=msg;t.className='show'+(bad?' bad':'');clearTimeout(t._t);t._t=setTimeout(()=>t.className='',2600);}
function openModal(html){$('#printArea').innerHTML=html;$('#modal').classList.remove('hidden');}
function closeModal(){$('#modal').classList.add('hidden');}
function download(name,content,type){const b=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function csv(rows){return rows.map(r=>r.map(c=>{const s=String(c??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');}

/* ---------- stock (FIFO batches) ---------- */
const stockQty=it=>sum(it.batches,b=>b.rem);
const stockValue=it=>sum(it.batches,b=>b.rem*b.cost);
const avgCost=it=>{const q=stockQty(it);return q?stockValue(it)/q:(it.lastCost||0);};
function oldestDate(it){const b=it.batches.filter(b=>b.rem>0).sort((a,b)=>a.date.localeCompare(b.date))[0];return b?b.date:null;}
function lastInDate(it){const b=it.batches.filter(b=>b.src==='purchase').sort((a,b)=>b.date.localeCompare(a.date))[0];return b?b.date:null;}
function addBatch(it,date,qty,cost,src){const b={id:uid('B'),date,qty,rem:qty,cost,src:src||'purchase'};it.batches.push(b);if(src==='purchase')it.lastCost=cost;return b;}
function consumeFIFO(it,qty){
  let need=qty,cost=0;
  const bs=it.batches.filter(b=>b.rem>0).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
  for(const b of bs){if(need<=0)break;const t=Math.min(b.rem,need);b.rem-=t;need-=t;cost+=t*b.cost;}
  it.batches=it.batches.filter(b=>b.rem>0||daysBetween(b.date,todayStr())<365);
  return r2(cost);
}
function ageBadge(days){
  if(days==null)return '<span class="badge b-n">–</span>';
  const c=days<=30?'b-g':days<=60?'b-a':days<=90?'b-o':'b-r';
  return `<span class="badge ${c}">${days} d</span>`;
}

/* ---------- money flows ---------- */
const saleTotal=s=>r2(sum(s.lines,l=>l.qty*l.price));
function ledger(){
  const L=[];
  db.purchases.forEach(p=>{if(['CASH','BOC','MPCS'].includes(p.paidFrom))L.push([p.date,p.paidFrom==='CASH'?'cash':p.paidFrom,-p.qty*p.cost]);});
  db.sales.forEach(s=>L.push([s.date,s.pay==='CASH'?'cash':s.pay,saleTotal(s)]));
  db.returns.forEach(r=>L.push([r.date,'cash',-r.qty*r.price]));
  db.expenses.forEach(e=>L.push([e.date,e.paidFrom==='CASH'?'cash':e.paidFrom,-e.amount]));
  db.deposits.forEach(d=>{L.push([d.date,'cash',-d.amount]);L.push([d.date,d.bank,d.amount]);});
  db.withdrawals.forEach(w=>{L.push([w.date,w.bank,-w.amount]);if(w.toCash)L.push([w.date,'cash',w.amount]);});
  db.capital.forEach(c=>L.push([c.date,c.to==='CASH'?'cash':c.to,c.amount]));
  return L;
}
function balances(upTo,L){
  L=L||ledger();const S=db.settings;
  const b={cash:num(S.openingCash),BOC:num(S.openingBOC),MPCS:num(S.openingMPCS)};
  L.forEach(([d,k,a])=>{if(!upTo||d<=upTo)b[k]+=a;});
  return b;
}
const PAID_LABEL={CASH:'Cash',BOC:'BOC',MPCS:'MPCS',EXTRA:'Extra money',OPENING:'Opening stock'};
function extraRows(pred){ // money put into the business from outside
  const R=[];
  db.purchases.filter(p=>p.paidFrom==='EXTRA'&&pred(p.date)).forEach(p=>R.push({date:p.date,kind:'Stock bought',desc:p.code+' '+p.name+' × '+p.qty+(p.supplier?' · '+p.supplier:''),amount:p.qty*p.cost}));
  db.capital.filter(c=>pred(c.date)).forEach(c=>R.push({date:c.date,kind:'Added to '+(c.to==='CASH'?'cash in hand':c.to),desc:c.note||'',amount:c.amount,id:c.id}));
  return R.sort((a,b)=>b.date.localeCompare(a.date));
}
const extraTotal=pred=>sum(extraRows(pred),r=>r.amount);
function monthStats(ym){
  const inM=d=>d.startsWith(ym);
  const S=db.sales.filter(s=>inM(s.date)),R=db.returns.filter(r=>inM(r.date)),E=db.expenses.filter(e=>inM(e.date));
  const revenue=sum(S,saleTotal),cogs=sum(S,s=>sum(s.lines,l=>l.cost));
  const ret=sum(R,r=>r.qty*r.price),retCost=sum(R.filter(r=>r.restock),r=>r.cost),exp=sum(E,e=>e.amount);
  const adjLoss=sum(db.adjustments.filter(a=>a.type==='loss'&&inM(a.date)),a=>-a.cost);
  const netSales=revenue-ret,netCogs=cogs-retCost,gross=netSales-netCogs,net=gross-exp-adjLoss;
  return{revenue,ret,netSales,cogs:netCogs,gross,exp,adjLoss,net,bills:S.length,
    units:sum(S,s=>sum(s.lines,l=>l.qty))-sum(R,r=>r.qty),margin:netSales?gross/netSales*100:0,netMargin:netSales?net/netSales*100:0};
}
function itemPerf(pred){
  const m={};
  const g=c=>m[c]||(m[c]={code:c,name:(db.items[c]||{}).name||c,cat:(db.items[c]||{}).category||'',qty:0,rqty:0,rev:0,cost:0});
  db.sales.forEach(s=>{if(!pred(s.date))return;s.lines.forEach(l=>{const x=g(l.code);x.qty+=l.qty;x.rev+=l.qty*l.price;x.cost+=l.cost;});});
  db.returns.forEach(r=>{if(!pred(r.date))return;const x=g(r.code);x.rqty+=r.qty;x.rev-=r.qty*r.price;if(r.restock)x.cost-=r.cost;});
  return Object.values(m).map(x=>({...x,net:x.qty-x.rqty,profit:x.rev-x.cost,margin:x.rev?(x.rev-x.cost)/x.rev*100:0}));
}

/* ---------- auth & navigation ---------- */
let user=null,ready=false;
const isAdmin=()=>user&&user.role==='admin';
const state={page:'dash',month:todayStr().slice(0,7),cart:[],rankPeriod:'3m',invSearch:'',invCat:'',invSort:'age',profitSort:'profit',bank:'BOC'};
let charts=[];

const PAGES=[
  {id:'dash',label:'Dashboard',icon:'◧',roles:['admin','sales'],grp:'Daily'},
  {id:'sale',label:'New sale',icon:'🛒',roles:['admin','sales'],grp:'Daily'},
  {id:'returns',label:'Sales returns',icon:'↩',roles:['admin','sales'],grp:'Daily'},
  {id:'expenses',label:'Expenses',icon:'🧾',roles:['admin','sales'],grp:'Daily'},
  {id:'deposits',label:'Cash deposits',icon:'🏦',roles:['admin','sales'],grp:'Daily'},
  {id:'history',label:'Sales history',icon:'📄',roles:['admin','sales'],grp:'Daily'},
  {id:'stockin',label:'Stock in',icon:'📦',roles:['admin'],grp:'Admin'},
  {id:'inventory',label:'Inventory',icon:'👟',roles:['admin'],grp:'Admin'},
  {id:'bank',label:'Bank & cash',icon:'💰',roles:['admin'],grp:'Admin'},
  {id:'profit',label:'Profit analysis',icon:'📈',roles:['admin'],grp:'Admin'},
  {id:'settings',label:'Settings & backup',icon:'⚙',roles:['admin'],grp:'Admin'},
];
function emailOf(u){u=u.trim().toLowerCase();return u.includes('@')?u:u+'@'+EMAIL_DOMAIN;}
async function doLogin(){
  if(typeof firebase==='undefined'){$('#l_msg').textContent='Firebase did not load. Check the internet connection and reload the page.';return;}
  if(!auth){$('#l_msg').textContent='Firebase is not connected yet: the firebaseConfig values in index.html still say PASTE_…';return;}
  const b=$('#l_btn');b.disabled=true;b.textContent='Signing in…';$('#l_msg').textContent='';
  const email=emailOf(val('l_user'));
  try{await auth.signInWithEmailAndPassword(email,val('l_pass'));$('#l_pass').value='';}
  catch(e){console.error(e);$('#l_msg').textContent=loginErr(e,email);}
  b.disabled=false;b.textContent='Sign in';
}
function loginErr(e,email){const c=e.code||'',h=location.hostname;
  const M={
   'auth/invalid-credential':`Wrong password, or the user ${email} does not exist. Check Firebase > Authentication > Users.`,
   'auth/wrong-password':'Wrong password.',

VIEWS.dash=function(){
  const ym=state.month,t=todayStr(),L=ledger(),bal=balances(null,L),ms=monthStats(ym);
  const todaySales=sum(db.sales.filter(s=>s.date===t),saleTotal)-sum(db.returns.filter(r=>r.date===t),r=>r.qty*r.price);
  const todayExp=sum(db.expenses.filter(e=>e.date===t),e=>e.amount);
  const todayBills=db.sales.filter(s=>s.date===t).length;
  const items=Object.values(db.items);
  const low=items.filter(i=>stockQty(i)<=(i.reorder??db.settings.lowStockDefault));
  const stockVal=sum(items,stockValue),units=sum(items,stockQty);
  const old=items.filter(i=>{const o=oldestDate(i);return o&&daysBetween(o,t)>90;});

  // daily table
  const dim=daysInMonth(ym);let rows='',tot={s:0,r:0,e:0,d:0,b:0};
  for(let d=1;d<=dim;d++){
    const ds=ym+'-'+String(d).padStart(2,'0');if(ds>t)break;
    const s=sum(db.sales.filter(x=>x.date===ds),saleTotal),r=sum(db.returns.filter(x=>x.date===ds),x=>x.qty*x.price);
    const e=sum(db.expenses.filter(x=>x.date===ds),x=>x.amount),dp=sum(db.deposits.filter(x=>x.date===ds),x=>x.amount);
    const b=s-r-e,cash=balances(ds,L).cash;
    tot.s+=s;tot.r+=r;tot.e+=e;tot.d+=dp;tot.b+=b;
    rows+=`<tr class="${ds===t?'today':''}"><td>${ds.slice(8)} ${new Date(ds+'T00:00').toLocaleString('en-US',{weekday:'short'})}</td><td class="n">${m0(s)}</td><td class="n">${r?m0(r):'–'}</td><td class="n">${m0(e)}</td><td class="n ${b<0?'negv':''}">${m0(b)}</td><td class="n">${dp?m0(dp):'–'}</td><td class="n"><b>${m0(cash)}</b></td></tr>`;
  }
  const table=rows?`<div class="tbl"><table><thead><tr><th>Day</th><th class="n">Sales</th><th class="n">Returns</th><th class="n">Expenses</th><th class="n">Day balance</th><th class="n">Deposited</th><th class="n">Cash in hand</th></tr></thead><tbody>${rows}
    <tr class="tot"><td>Total</td><td class="n">${m0(tot.s)}</td><td class="n">${m0(tot.r)}</td><td class="n">${m0(tot.e)}</td><td class="n">${m0(tot.b)}</td><td class="n">${m0(tot.d)}</td><td class="n">–</td></tr></tbody></table></div>`
    :'<div class="empty">No days to show for this month yet.</div>';

  const top=itemPerf(d=>d.startsWith(ym)).filter(x=>x.net>0).sort((a,b)=>b.net-a.net).slice(0,5);

  return `
  ${low.length&&isAdmin()?`<div class="alert">⚠ ${low.length} item(s) at or below re-order level. <a href="#" onclick="state.invSort='qty';go('inventory');return false">View inventory</a></div>`:''}
  ${old.length&&isAdmin()?`<div class="alert">⏳ ${old.length} item(s) have stock older than 90 days. Consider a discount or promotion.</div>`:''}
  <div class="kpis">
    <div class="kpi"><div class="l">Today's sales</div><div class="v">${money(todaySales)}</div><div class="s">${todayBills} bill(s)</div></div>
    <div class="kpi neg"><div class="l">Today's expenses</div><div class="v">${money(todayExp)}</div></div>
    <div class="kpi cash"><div class="l">Cash in hand</div><div class="v">${money(bal.cash)}</div><div class="s">now</div></div>
    ${isAdmin()?`<div class="kpi bank"><div class="l">BOC balance</div><div class="v">${money(bal.BOC)}</div></div>
    <div class="kpi bank"><div class="l">MPCS balance</div><div class="v">${money(bal.MPCS)}</div></div>`:''}
  </div>
  <div class="card"><div class="card-h"><h3>${monthLabel(ym)}</h3>${monthNav()}</div>
    <div class="kpis" style="margin:0">
      <div class="kpi"><div class="l">Net sales</div><div class="v">${money(ms.netSales)}</div><div class="s">${ms.bills} bills · ${ms.units} pairs</div></div>
      <div class="kpi neg"><div class="l">Expenses</div><div class="v">${money(ms.exp)}</div></div>
      ${isAdmin()?`<div class="kpi ${ms.net<0?'neg':''}"><div class="l">Net profit</div><div class="v">${money(ms.net)}</div><div class="s">Gross margin ${pct(ms.margin)}</div></div>
      <div class="kpi"><div class="l">Stock value (cost)</div><div class="v">${money(stockVal)}</div><div class="s">${units} pairs · ${items.length} items</div></div>
      <div class="kpi bank"><div class="l">Extra money in</div><div class="v">${money(extraTotal(d=>d.startsWith(ym)))}</div><div class="s">Total to date ${money(extraTotal(()=>true))}</div></div>`:
      `<div class="kpi"><div class="l">Returns</div><div class="v">${money(ms.ret)}</div></div>`}
    </div>
  </div>
  <div class="card"><h3>Sales and expenses trend</h3><div class="chart-box"><canvas id="c_trend"></canvas></div></div>
  <div class="card"><h3>Daily summary</h3>${table}</div>
  <div class="two">
    <div class="card"><h3>Top sellers this month</h3>${top.length?`<ol class="rank">${top.map(x=>`<li><span>${esc(x.name)} <small class="hint">${esc(x.code)}</small></span><b>${x.net} pairs</b></li>`).join('')}</ol>`:'<div class="empty">No sales yet this month.</div>'}</div>
    <div class="card"><h3>Low stock</h3>${low.length?`<ol class="rank">${low.slice(0,8).map(i=>`<li><span>${esc(i.name)} <small class="hint">${esc(i.code)}</small></span><b class="negv">${stockQty(i)} left</b></li>`).join('')}</ol>`:'<div class="empty">All items are above re-order level.</div>'}</div>
  </div>`;
};
AFTER.dash=function(){
  const ym=state.month,dim=daysInMonth(ym),labels=[],s=[],e=[],b=[];
  for(let d=1;d<=dim;d++){const ds=ym+'-'+String(d).padStart(2,'0');labels.push(d);
    const sv=sum(db.sales.filter(x=>x.date===ds),saleTotal)-sum(db.returns.filter(x=>x.date===ds),x=>x.qty*x.price);
    const ev=sum(db.expenses.filter(x=>x.date===ds),x=>x.amount);s.push(r2(sv));e.push(r2(ev));b.push(r2(sv-ev));}

    options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}},scales:{y:{ticks:{callback:v=>m0(v)}}}}});
};

function onSaleCode(){
  const it=db.items[normCode(val('s_code'))],h=$('#s_hint');
  if(!it){h.className='hint';h.textContent=val('s_code')?'No item with this code yet.':'';return;}
  const inCart=sum(state.cart.filter(l=>l.code===it.code),l=>l.qty),q=stockQty(it)-inCart;
  $('#s_price').value=it.sellPrice||'';
  h.className='hint '+(q>0?'ok':'bad');
  h.textContent=`${it.name}${it.size?' · size '+it.size:''}${it.color?' · '+it.color:''} — ${q} available`+(isAdmin()?` · avg cost ${money(avgCost(it))}`:'');
}
function addToCart(){
  const code=normCode(val('s_code')),it=db.items[code],qty=parseInt(val('s_qty'),10),price=num(val('s_price'));
  if(!it)return toast('Enter a valid item code.',true);
  if(!(qty>0))return toast('Quantity must be at least 1.',true);
  if(price<=0)return toast('Enter the sale price.',true);
  const inCart=sum(state.cart.filter(l=>l.code===code),l=>l.qty);
  if(qty+inCart>stockQty(it))return toast(`Only ${stockQty(it)-inCart} of ${code} in stock.`,true);
  if(price<avgCost(it)&&!confirm(`This price is below the buying cost (${money(avgCost(it))}). Add anyway?`))return;
  const ex=state.cart.find(l=>l.code===code&&l.price===price);
  if(ex)ex.qty+=qty;else state.cart.push({code,name:it.name,size:it.size||'',qty,price});
  $('#s_code').value='';$('#s_qty').value=1;$('#s_price').value='';$('#s_hint').textContent='';$('#s_code').focus();
  renderCart();
}
function renderCart(){
  const c=state.cart,el=$('#cart');if(!el)return;
  if(!c.length){el.innerHTML='<div class="empty">Add items above. A bill can have several items.</div>';return;}
  const total=sum(c,l=>l.qty*l.price);
  el.innerHTML=`<div class="tbl"><table><thead><tr><th>Code</th><th>Item</th><th class="n">Qty</th><th class="n">Price</th><th class="n">Amount</th><th></th></tr></thead><tbody>
  ${c.map((l,i)=>`<tr><td>${esc(l.code)}</td><td>${esc(l.name)}${l.size?' <small class="hint">'+esc(l.size)+'</small>':''}</td><td class="n">${l.qty}</td><td class="n">${m0(l.price)}</td><td class="n">${m0(l.qty*l.price)}</td><td><button class="btn ghost sm" onclick="state.cart.splice(${i},1);renderCart()" aria-label="Remove">✕</button></td></tr>`).join('')}
  </tbody></table></div>
  <div class="row-end"><span>Total</span><span class="cart-total">${money(total)}</span></div>
  <div class="row-end"><button class="btn ghost" onclick="if(confirm('Clear this bill?')){state.cart=[];renderCart()}">Clear bill</button><button class="btn dark" id="btnSale" onclick="completeSale()">Complete sale</button></div>`;
}
let saleBusy=false;
async function completeSale(){
  const c=state.cart;if(!c.length||saleBusy)return;
  const date=val('s_date')||todayStr(),pay=val('s_pay'),customer=val('s_cust').trim();
  const need={};c.forEach(l=>need[l.code]=(need[l.code]||0)+l.qty);
  for(const k in need){if(!db.items[k]||need[k]>stockQty(db.items[k]))return toast('Not enough stock for '+k,true);}
  saleBusy=true;const btn=$('#btnSale');if(btn){btn.disabled=true;btn.textContent='Saving…';}
  let id=null;
  if(fs&&navigator.onLine){
    try{ // online: invoice number + stock updated safely even if two phones sell at once
      const res=await fs.runTransaction(async tx=>{
        const cRef=fs.collection('meta').doc('counter'),codes=Object.keys(need),iRefs=codes.map(k=>fs.collection('items').doc(k));
        const cs=await tx.get(cRef),fresh={};
        for(let i=0;i<codes.length;i++){const sn=await tx.get(iRefs[i]);if(!sn.exists)throw new Error('Item '+codes[i]+' not found');fresh[codes[i]]=sn.data();}
        for(const k of codes)if(need[k]>stockQty(fresh[k]))throw new Error('Only '+stockQty(fresh[k])+' of '+k+' left in stock');
        const seq=(cs.exists?(cs.data().invSeq||0):0)+1,sid='INV'+String(seq).padStart(5,'0');
        const lines=c.map(l=>({code:l.code,name:l.name,size:l.size||'',qty:l.qty,price:l.price,cost:consumeFIFO(fresh[l.code],l.qty)}));
        const sale={id:sid,date,time:nowTime(),pay,customer,user:user.name,lines};
        tx.set(cRef,{invSeq:seq},{merge:true});codes.forEach((k,i)=>tx.set(iRefs[i],clean(fresh[k])));tx.set(fs.collection('sales').doc(sid),clean(sale));
        return{sale,fresh};
      });
      id=res.sale.id;Object.assign(db.items,res.fresh);db.sales.push(res.sale);
      for(const k in res.fresh)synced.items[k]=stable(clean(res.fresh[k]));synced.sales[id]=stable(clean(res.sale));
    }catch(e){
      const net=/unavailable|deadline|network|offline/i.test((e.code||'')+' '+(e.message||''));
      if(!net){saleBusy=false;renderCart();return toast(e.message||'Sale could not be saved.',true);}
    }
  }
  if(!id){ // offline: save on this phone, syncs when internet returns
    id='INV-'+date.replace(/-/g,'').slice(2)+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
    const lines=c.map(l=>({code:l.code,name:l.name,size:l.size||'',qty:l.qty,price:l.price,cost:consumeFIFO(db.items[l.code],l.qty)}));
    db.sales.push({id,date,time:nowTime(),pay,customer,user:user.name,lines});save();
  }
  saleBusy=false;state.cart=[];toast('Sale saved · '+id);refresh();showReceipt(id);
}
function showReceipt(id){

  const rets=db.returns.filter(r=>r.invId===id);

    <h4>${esc(S.shop)}</h4>${S.address?`<div class="c">${esc(S.address)}</div>`:''}${S.phone?`<div class="c">Tel: ${esc(S.phone)}</div>`:''}
    <hr><div>Invoice: <b>${s.id}</b><br>Date: ${s.date} ${s.time||''}<br>Cashier: ${esc(s.user)}${s.customer?'<br>Customer: '+esc(s.customer):''}</div><hr>

function returnedQty(invId,idx){return sum(db.returns.filter(r=>r.invId===invId&&r.line===idx),r=>r.qty);}
function onRetInv(){

function saveReturn(invId){
  const s=db.sales.find(x=>x.id===invId),idx=parseInt(val('r_line'),10),l=s&&s.lines[idx],qty=parseInt(val('r_qty'),10);

  const unit=l.cost/l.qty,restock=val('r_cond')==='1';

function voidSale(id){
  if(db.returns.some(r=>r.invId===id))return toast('This bill has returns. Void is not allowed.',true);

}

  $('#p_sell').value=it.sellPrice||'';$('#p_reorder').value=it.reorder??db.settings.lowStockDefault;$('#p_cost').value=it.lastCost||'';

function purTotal(){const q=num(val('p_qty')),c=num(val('p_cost')),s=num(val('p_sell'));
  $('#p_total').innerHTML=q&&c?`Total cost <b>${money(q*c)}</b>${s?` · margin ${pct((s-c)/s*100)}`:''}`:'';}
function savePurchase(){
  const code=normCode(val('p_code')),name=val('p_name').trim(),qty=parseInt(val('p_qty'),10),cost=num(val('p_cost'));
  if(!code)return toast('Enter an item code.',true);
  if(code.includes('/'))return toast('Item code cannot contain "/".',true);
  if(!name)return toast('Enter the item name.',true);
  if(!(qty>0))return toast('Quantity must be at least 1.',true);
  if(cost<=0)return toast('Enter the buying price.',true);
  const date=val('p_date')||todayStr(),paid=val('p_paid');
  let it=db.items[code];
  if(!it)it=db.items[code]={code,batches:[],created:date};
  Object.assign(it,{name,category:val('p_cat').trim(),size:val('p_size').trim(),color:val('p_color').trim(),
    sellPrice:num(val('p_sell'))||it.sellPrice||0,reorder:parseInt(val('p_reorder'),10)||0});
  const b=addBatch(it,date,qty,cost,'purchase');
  db.purchases.push({id:uid('P'),date,code,name,qty,cost,paidFrom:paid,supplier:val('p_sup').trim(),batchId:b.id,user:user.name});
  save();toast(`${qty} × ${code} added · now ${stockQty(it)} in stock`);refresh();

function editPurchase(id){
  const p=db.purchases.find(x=>x.id===id);if(!p)return;
  const it=db.items[p.code],b=it&&it.batches.find(x=>x.id===p.batchId),sold=b?b.qty-b.rem:(it?p.qty:0);
  openModal(`<h3 style="margin-top:0">Edit stock entry · ${esc(p.code)}</h3><div class="grid">
    <label>Date received<input type="date" id="ep_date" value="${p.date}"></label>
    <label>Quantity (pairs)<input type="number" id="ep_qty" min="${Math.max(1,sold)}" step="1" value="${p.qty}"></label>
    <label>Buying price / pair<input type="number" id="ep_cost" min="0" step="0.01" value="${p.cost}"></label>
    <label>Supplier<input id="ep_sup" value="${esc(p.supplier)}"></label>
    <label>Paid from<select id="ep_paid">${Object.entries(PAID_LABEL).map(([k,l])=>`<option value="${k}" ${p.paidFrom===k?'selected':''}>${l}</option>`).join('')}</select></label>
  </div><p class="hint">${sold?`${sold} pair(s) from this entry are already sold, so the quantity can't go below ${sold}. A new price applies to the pairs not yet sold.`:'Nothing from this entry is sold yet.'}</p>
  <div class="row-end"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="savePurchaseEdit('${p.id}')">Save changes</button></div>`);
}
function savePurchaseEdit(id){
  const p=db.purchases.find(x=>x.id===id),it=db.items[p.code],b=it&&it.batches.find(x=>x.id===p.batchId);
  const qty=parseInt(val('ep_qty'),10),cost=num(val('ep_cost')),date=val('ep_date')||p.date;
  if(!(qty>0))return toast('Quantity must be at least 1.',true);
  if(cost<=0)return toast('Enter the buying price.',true);
  if(it){
    if(!b){if(qty!==p.qty)return toast('This stock is fully sold, so the quantity cannot change.',true);}
    else{const sold=b.qty-b.rem;if(qty<sold)return toast(`${sold} pairs are already sold. Quantity must be at least ${sold}.`,true);
      b.qty=qty;b.rem=qty-sold;b.cost=cost;b.date=date;}
    if(it.lastCost===p.cost)it.lastCost=cost;
  }
  Object.assign(p,{date,qty,cost,supplier:val('ep_sup').trim(),paidFrom:val('ep_paid')});
  save();closeModal();toast('Stock entry updated');refresh();
}
function delPurchase(id){
  const p=db.purchases.find(x=>x.id===id),it=db.items[p.code],b=it&&it.batches.find(x=>x.id===p.batchId);
  if(it&&(!b||b.rem<b.qty))return toast('Some of this stock is already sold. Use Edit instead, or adjust stock in Inventory.',true);
  if(!confirm('Delete this stock entry?'))return;
  if(it)it.batches=it.batches.filter(x=>x.id!==p.batchId);
  db.purchases=db.purchases.filter(x=>x.id!==id);save();toast('Stock entry deleted');refresh();
}

function editItem(code){

  </div>
  <h3 style="margin:18px 0 8px">Stock quantity</h3><div class="grid">
    <label>Pairs in stock<input id="ei_qty" type="number" min="0" step="1" value="${stockQty(i)}" inputmode="numeric"></label>
    <label>Reason for change<select id="ei_reason"><option value="correction">Correction (count or entry mistake)</option><option value="loss">Damaged / lost / stolen (counted as a loss)</option></select></label>
    <label>Cost / pair for added pairs<input id="ei_cost" type="number" min="0" step="0.01" value="${r2(avgCost(i))}"></label>
    <label>Note<input id="ei_note" placeholder="Optional"></label>

  <div class="row-end"><button class="btn red" onclick="deleteItem('${esc(code)}')">Delete item</button><span style="flex:1"></span><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveItem('${esc(code)}')">Save changes</button></div>`);
}
function saveItem(code){const i=db.items[code];
  const q=stockQty(i),nq=parseInt(val('ei_qty'),10);
  if(!(nq>=0))return toast('Enter a valid quantity (0 or more).',true);
  const diff=nq-q;let type=val('ei_reason');
  if(diff>0&&type==='loss')return toast('A loss can only reduce stock. Choose "Correction" to add pairs.',true);
  const cost=num(val('ei_cost'));
  if(diff>0&&cost<=0)return toast('Enter the cost per pair for the added pairs.',true);
  Object.assign(i,{name:val('ei_name').trim()||i.name,category:val('ei_cat').trim(),size:val('ei_size').trim(),color:val('ei_color').trim(),sellPrice:num(val('ei_sell')),reorder:parseInt(val('ei_re'),10)||0});
  if(diff!==0){
    let value;
    if(diff<0)value=-consumeFIFO(i,-diff);else{addBatch(i,todayStr(),diff,cost,'adjust');value=r2(diff*cost);}
    db.adjustments.push({id:uid('A'),date:todayStr(),code,name:i.name,qty:diff,cost:value,type,note:val('ei_note').trim(),user:user.name});
  }
  save();closeModal();toast(diff?`Item updated · stock ${q} → ${nq}`:'Item updated');refresh();}
function deleteItem(code){const i=db.items[code],q=stockQty(i);
  if(!confirm(`Delete ${code} (${i.name})?${q?` ${q} pair(s) still in stock will be removed.`:''} Past sales stay in the reports.`))return;
  if(q)db.adjustments.push({id:uid('A'),date:todayStr(),code,name:i.name,qty:-q,cost:-r2(stockValue(i)),type:'correction',note:'Item deleted',user:user.name});
  delete db.items[code];save();closeModal();toast(code+' deleted');refresh();}
function exportStock(){const t=todayStr();
  const rows=[['Code','Name','Category','Size','Colour','Qty','Avg cost','Sell price','Stock value','Oldest stock date','Age days']];
  Object.values(db.items).forEach(i=>{const o=oldestDate(i);rows.push([i.code,i.name,i.category,i.size,i.color,stockQty(i),r2(avgCost(i)),i.sellPrice,r2(stockValue(i)),o||'',o?daysBetween(o,t):'']);});
  download('mihely-stock-'+t+'.csv',csv(rows),'text/csv');}

/* ---------- BANK & CASH ---------- */
function bankEvents(bank){
  const E=[];
  db.deposits.filter(d=>d.bank===bank).forEach(d=>E.push({date:d.date,desc:'Cash deposit'+(d.ref?' ('+d.ref+')':''),amt:d.amount}));
  db.withdrawals.filter(w=>w.bank===bank).forEach(w=>E.push({date:w.date,desc:'Withdrawal – '+w.purpose+(w.toCash?' (to cash in hand)':''),amt:-w.amount,id:w.id}));
  db.sales.filter(s=>s.pay===bank).forEach(s=>E.push({date:s.date,desc:'Card / transfer sale '+s.id,amt:saleTotal(s)}));
  db.expenses.filter(e=>e.paidFrom===bank).forEach(e=>E.push({date:e.date,desc:'Expense – '+e.category+': '+e.desc,amt:-e.amount}));
  db.purchases.filter(p=>p.paidFrom===bank).forEach(p=>E.push({date:p.date,desc:'Stock purchase '+p.code+' ×'+p.qty,amt:-p.qty*p.cost}));
  db.capital.filter(c=>c.to===bank).forEach(c=>E.push({date:c.date,desc:'Extra money in'+(c.note?' – '+c.note:''),amt:c.amount}));
  return E.sort((a,b)=>a.date.localeCompare(b.date));
}

    <label>Date<input type="date" id="x_date" value="${todayStr()}"></label>

  ${X.length?`<div class="tbl"><table><thead><tr><th>Date</th><th>Type</th><th>Details</th><th class="n">Amount</th><th></th></tr></thead><tbody>
  ${X.map(r=>`<tr><td>${r.date}</td><td>${esc(r.kind)}</td><td>${esc(r.desc)}</td><td class="n">${m0(r.amount)}</td><td>${r.id?`<button class="btn ghost sm" onclick="delRec('capital','${r.id}')">Delete</button>`:''}</td></tr>`).join('')}

    <label>Date<input type="date" id="w_date" value="${todayStr()}"></label>

  <tr><td>${ym}-01</td><td><i>Opening balance</i></td><td></td><td></td><td class="n"><b>${m0(open)}</b></td><td></td></tr>${rows||'<tr><td colspan="6" class="empty">No transactions this month.</td></tr>'}

function saveCapital(){
  const amt=num(val('x_amt'));if(amt<=0)return toast('Enter the amount.',true);
  db.capital.push({id:uid('X'),date:val('x_date')||todayStr(),amount:r2(amt),to:val('x_to'),note:val('x_note').trim(),user:user.name});
  save();toast('Extra money saved');refresh();
}
function saveWithdrawal(){
  const amt=num(val('w_amt')),bank=val('w_bank');if(amt<=0)return toast('Enter the amount.',true);
  const purpose=val('w_purpose').trim();if(!purpose)return toast('Enter the purpose.',true);
  if(amt>balances()[bank]&&!confirm('This is more than the '+bank+' balance. Save anyway?'))return;
  db.withdrawals.push({id:uid('W'),date:val('w_date')||todayStr(),bank,amount:r2(amt),purpose,toCash:$('#w_cash').checked,user:user.name});
  save();toast('Withdrawal saved');refresh();
}

VIEWS.profit=function(){
  const ym=state.month,ms=monthStats(ym),prev=monthStats(addMonths(ym,-1));
  const chg=(a,b)=>b?`<span class="${a>=b?'pos':'negv'}">${a>=b?'▲':'▼'} ${pct(Math.abs((a-b)/Math.abs(b)*100))}</span> vs last month`:'';
  let items=itemPerf(d=>d.startsWith(ym));
  const sorters={profit:(a,b)=>b.profit-a.profit,qty:(a,b)=>b.net-a.net,margin:(a,b)=>b.margin-a.margin,rev:(a,b)=>b.rev-a.rev};
  items.sort(sorters[state.profitSort]);
  const cat={};items.forEach(x=>{const k=x.cat||'Uncategorised';cat[k]=cat[k]||{rev:0,profit:0,qty:0};cat[k].rev+=x.rev;cat[k].profit+=x.profit;cat[k].qty+=x.net;});
  const E=db.expenses.filter(e=>e.date.startsWith(ym)),ec={};E.forEach(e=>ec[e.category]=(ec[e.category]||0)+e.amount);
  return `
  <div class="card"><div class="card-h"><h3>Profit for ${monthLabel(ym)}</h3>${monthNav()}</div>
  <div class="tbl"><table><tbody>
    <tr><td>Gross sales</td><td class="n">${money(ms.revenue)}</td></tr>
    <tr><td>Less: sales returns</td><td class="n negv">(${money(ms.ret)})</td></tr>
    <tr class="tot"><td>Net sales</td><td class="n">${money(ms.netSales)}</td></tr>
    <tr><td>Less: cost of goods sold (FIFO)</td><td class="n negv">(${money(ms.cogs)})</td></tr>
    <tr class="tot"><td>Gross profit · margin ${pct(ms.margin)}</td><td class="n">${money(ms.gross)}</td></tr>
    <tr><td>Less: expenses</td><td class="n negv">(${money(ms.exp)})</td></tr>
    ${ms.adjLoss?`<tr><td>Less: stock written off (damaged / lost)</td><td class="n negv">(${money(ms.adjLoss)})</td></tr>`:''}
    <tr class="tot"><td>Net profit · margin ${pct(ms.netMargin)}</td><td class="n ${ms.net<0?'negv':'pos'}" style="font-size:18px">${money(ms.net)}</td></tr>
  </tbody></table></div>
  ${extraTotal(d=>d.startsWith(ym))?`<p class="hint">Extra money put in this month: <b>${money(extraTotal(d=>d.startsWith(ym)))}</b> (not counted in profit).</p>`:''}</div>
  <div class="kpis">
    <div class="kpi"><div class="l">Net sales</div><div class="v">${money(ms.netSales)}</div><div class="s">${chg(ms.netSales,prev.netSales)}</div></div>
    <div class="kpi"><div class="l">Gross profit</div><div class="v">${money(ms.gross)}</div><div class="s">${chg(ms.gross,prev.gross)}</div></div>
    <div class="kpi ${ms.net<0?'neg':''}"><div class="l">Net profit</div><div class="v">${money(ms.net)}</div><div class="s">${chg(ms.net,prev.net)}</div></div>
    <div class="kpi bank"><div class="l">Average bill value</div><div class="v">${money(ms.bills?ms.revenue/ms.bills:0)}</div><div class="s">${ms.bills} bills · ${ms.units} pairs</div></div>
  </div>
  <div class="card"><h3>12-month profit trend</h3><div class="chart-box"><canvas id="c_profit"></canvas></div></div>
  <div class="card"><div class="card-h"><h3>Item-wise profit</h3><div class="toolbar" style="flex:0 1 auto">
    <select style="width:auto" onchange="state.profitSort=this.value;refresh()">${[['profit','Highest profit'],['qty','Most sold'],['margin','Highest margin'],['rev','Highest sales']].map(([v,l])=>`<option value="${v}" ${state.profitSort===v?'selected':''}>${l}</option>`).join('')}</select>
    <button class="btn ghost" onclick="exportProfit()">Export CSV</button></div></div>

  <tr class="tot"><td colspan="2">Total</td><td class="n">${sum(items,x=>x.qty)}</td><td class="n">${sum(items,x=>x.rqty)}</td><td class="n">${m0(sum(items,x=>x.rev))}</td><td class="n">${m0(sum(items,x=>x.cost))}</td><td class="n">${m0(sum(items,x=>x.profit))}</td><td></td></tr>

function exportProfit(){const rows=[['Code','Item','Category','Sold','Returned','Net sales','Cost','Profit','Margin %']];

    <div class="alert">Data is saved in Firebase and shared by every signed-in phone and computer. Download a backup now and then as an extra copy.</div>
    <div class="toolbar"><button class="btn dark" onclick="exportBackup()">Download backup</button>
      <label>Restore from backup<input type="file" accept=".json,application/json" onchange="importBackup(this)"></label>
      <button class="btn ghost" onclick="migrateOld()">Upload data saved in this browser (old version)</button></div>
  </div>
  <div class="card"><h3>Try it out</h3><p class="hint">Fill the app with 90 days of sample shoes, sales and expenses to explore the reports. This replaces current data.</p>
    <div class="toolbar"><button class="btn ghost" onclick="loadDemo()">Load sample data</button><button class="btn red" onclick="resetAll()">Erase all data</button></div></div>`;
};
function saveSettings(){const S=db.settings;
  Object.assign(S,{shop:val('st_shop').trim()||'Mihely Shoe Shop',address:val('st_addr').trim(),phone:val('st_phone').trim(),lowStockDefault:parseInt(val('st_low'),10)||0,
    openingCash:num(val('st_oc')),openingBOC:num(val('st_ob')),openingMPCS:num(val('st_om'))});
  save();$('#shopName').textContent=S.shop;toast('Settings saved');}
async function changePw(){const p=val('st_np');if(p.length<6)return toast('Password must be at least 6 characters.',true);
  try{await auth.currentUser.updatePassword(p);$('#st_np').value='';toast('Password changed');}
  catch(e){toast(e.code==='auth/requires-recent-login'?'Sign out, sign in again, then change the password.':'Could not change password: '+e.code,true);}}
function replaceAllData(d,msg){
  const n=DEFAULT_DB();db=Object.assign(n,{items:d.items||{},purchases:d.purchases||[],sales:d.sales||[],returns:d.returns||[],deposits:d.deposits||[],withdrawals:d.withdrawals||[],expenses:d.expenses||[],capital:d.capital||[],adjustments:d.adjustments||[]});
  const st=Object.assign(DEFAULT_DB().settings,d.settings||{});delete st.users;delete st.invSeq;db.settings=st;
  save();setCounterFromSales();toast(msg);refresh();}
function migrateOld(){let d=null;try{d=JSON.parse(localStorage.getItem(OLD_KEY));}catch(e){}
  if(!d||!d.items)return toast('No data from the old version was found in this browser.',true);
  if(!confirm('Upload the data saved in this browser to Firebase? It replaces what is in the cloud now.'))return;
  replaceAllData(d,'Old data uploaded');}
function exportBackup(){download('mihely-backup-'+todayStr()+'.json',JSON.stringify(db,null,1),'application/json');}
function importBackup(inp){const f=inp.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!d.items||!d.sales)throw 0;
    if(!confirm('Replace all current data with this backup?'))return;
    replaceAllData(d,'Backup restored');}
    catch(e){toast('This file is not a valid backup.',true);}};rd.readAsText(f);}
function resetAll(){if(prompt('Type ERASE to delete all data on this device.')!=='ERASE')return;
  db=DEFAULT_DB();save();setCounterFromSales();toast('All data erased');refresh();}

function loadDemo(){
  if(!confirm('Replace ALL current data with sample data?'))return;
  db=DEFAULT_DB();let seq=0;
  Object.assign(db.settings,{openingCash:20000,openingBOC:150000,openingMPCS:75000,address:'Main Street',phone:'011 000 0000'});
  const cat=[['MS-101','Leather office shoe','Gents','42','Black',3200,5200],['MS-102','Leather office shoe','Gents','40','Brown',3200,5200],
    ['MS-110','Casual loafer','Gents','41','Tan',2600,4300],['MS-120','Running sneaker','Sports','42','Grey',4100,6900],['MS-121','Running sneaker','Sports','39','Blue',4100,6900],
    ['LS-201','Block heel sandal','Ladies','37','Beige',2100,3600],['LS-202','Flat ballerina','Ladies','38','Black',1800,3100],['LS-210','Wedge slipper','Ladies','37','Pink',1400,2500],
    ['LS-220','Party heel','Ladies','38','Gold',3500,5900],['KS-301','School shoe','School','34','Black',1900,3000],['KS-302','School shoe','School','32','Black',1850,2950],
    ['KS-310','Kids sneaker LED','Kids','28','Red',1600,2800],['SL-401','Rubber slipper','Slippers','9','Blue',450,850],['SL-402','Rubber slipper','Slippers','8','Black',450,850],
    ['SP-501','Football boot','Sports','41','White',5200,8500]];
  const T=new Date(),D=k=>{const d=new Date(T);d.setDate(d.getDate()-k);return dstr(d);};
  const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
  cat.forEach(([code,name,category,size,color,cost,sell],i)=>{
    const it=db.items[code]={code,name,category,size,color,sellPrice:sell,reorder:3,batches:[],created:D(100)};
    const q1=rnd(14,30),b1=addBatch(it,D(100-i),q1,cost,'purchase');
    db.purchases.push({id:uid('P'),date:D(100-i),code,name,qty:q1,cost,paidFrom:'OPENING',supplier:'Opening stock',batchId:b1.id,user:'inok'});
    if(i%3!==2){const q2=rnd(8,16),c2=Math.round(cost*1.04),b2=addBatch(it,D(40-i),q2,c2,'purchase');
      db.purchases.push({id:uid('P'),date:D(40-i),code,name,qty:q2,cost:c2,paidFrom:i%2?'BOC':'MPCS',supplier:'Colombo Footwear Distributors',batchId:b2.id,user:'inok'});}
  });
  const weight=[5,3,4,4,2,5,4,3,1,6,4,3,8,7,1];let cash=20000;
  for(let k=90;k>=0;k--){const date=D(k);const nb=rnd(2,7);
    for(let n=0;n<nb;n++){const lines=[];const nl=Math.random()<.25?2:1;
      for(let j=0;j<nl;j++){let pick=0,r=Math.random()*sum(weight);for(let w=0;w<weight.length;w++){r-=weight[w];if(r<=0){pick=w;break;}}
        const it=db.items[cat[pick][0]];if(stockQty(it)<1||lines.some(l=>l.code===it.code))continue;
        const price=Math.random()<.2?Math.round(it.sellPrice*.9):it.sellPrice;
        lines.push({code:it.code,name:it.name,size:it.size,qty:1,price,cost:consumeFIFO(it,1)});}
      if(!lines.length)continue;seq++;
      const pay=Math.random()<.15?(Math.random()<.5?'BOC':'MPCS'):'CASH';
      const s={id:'INV'+String(seq).padStart(5,'0'),date,time:String(rnd(9,19)).padStart(2,'0')+':'+String(rnd(0,59)).padStart(2,'0'),pay,customer:'',user:'sales',lines};
      db.sales.push(s);if(pay==='CASH')cash+=saleTotal(s);}
    db.expenses.push({id:uid('E'),date,category:'Tea & Meals',desc:'Staff tea',amount:rnd(3,6)*100,paidFrom:'CASH',user:'sales'});
    if(date.endsWith('-01')){db.expenses.push({id:uid('E'),date,category:'Rent',desc:'Shop rent',amount:45000,paidFrom:'BOC',user:'inok'});}
    if(date.endsWith('-05')){db.expenses.push({id:uid('E'),date,category:'Electricity',desc:'CEB bill',amount:rnd(60,90)*100,paidFrom:'CASH',user:'sales'});
      db.expenses.push({id:uid('E'),date,category:'Salaries',desc:'Sales assistant salary',amount:35000,paidFrom:'MPCS',user:'inok'});}
    if(k%10===3&&db.sales.length>5){const s=db.sales[db.sales.length-rnd(2,5)],l=s.lines[0];
      if(l&&returnedQty(s.id,0)===0&&s.date<=date){const restock=Math.random()<.8;
        db.returns.push({id:uid('R'),date,invId:s.id,line:0,code:l.code,name:l.name,qty:1,price:l.price,cost:l.cost,restock,reason:restock?'Size exchange':'Sole defect',user:'sales'});
        if(restock)addBatch(db.items[l.code],date,1,l.cost,'return');}}
    if(k%3===0){const bal=balances(date).cash;if(bal>25000){const amt=Math.round((bal-15000)/1000)*1000;
      db.deposits.push({id:uid('D'),date,bank:Math.random()<.6?'BOC':'MPCS',amount:amt,ref:'SLIP'+rnd(1000,9999),user:'sales'});}}
  }
  save();setCounterFromSales();toast('Sample data loaded');state.month=todayStr().slice(0,7);go('dash');
}

/* ---------- start ---------- */
if(auth){
  auth.onAuthStateChanged(u=>{
    if(u){const em=(u.email||'').toLowerCase();
      user={name:em.split('@')[0],email:em,role:ADMIN_EMAILS.map(x=>x.toLowerCase()).includes(em)?'admin':'sales'};
      ready=false;boot();startSync();}
    else{user=null;ready=false;stopSync();db=DEFAULT_DB();boot();}
  });
}
boot();
</script>
